<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
  </style>
</head>
<body>
  <script>
    const ID_WIDGET = "1e9d8f8b-99b5-4157-b238-9be13f64529d";
    const MAPPA = {
      "CLASSIFICA": "https://tuttocampo.it" + ID_WIDGET,
      "RISULTATI":  "https://tuttocampo.it" + ID_WIDGET,
      "MARCATORI":  "https://tuttocampo.it" + ID_WIDGET,
      "ULTIMA":     "https://tuttocampo.it" + ID_WIDGET,
      "PROSSIMA":   "https://tuttocampo.it" + ID_WIDGET
    };

    const params = new URLSearchParams(window.location.search);
    const ultimoComando = params.get('stato') || "OFF";

    async function controllaStato() {
      try {
        const risposta = await fetch('stato.txt?t=' + Date.now());
        const comando = (await risposta.text()).trim().toUpperCase();

        if (comando !== ultimoComando) {
          if (MAPPA[comando]) {
            window.location.href = MAPPA[comando];
          } else {
            window.location.href = window.location.pathname + "?stato=OFF";
          }
        }
      } catch (e) {}
    }

    setInterval(controllaStato, 3000);
    controllaStato();
  </script>
</body>
</html>
